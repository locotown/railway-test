<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Railway Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }
    h1 { margin-bottom: 0.5rem; }
    .status { font-size: 1.2rem; margin: 1rem 0; }
    .api-result {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Railway Test</h1>
    <p class="status">Deployed Successfully!</p>
    <div class="api-result" id="apiResult">API Response: Loading...</div>
  </div>
  <script>
    fetch('/api/hello')
      .then(res => res.json())
      .then(data => {
        document.getElementById('apiResult').textContent =
          `API Response: ${data.message} (${data.timestamp})`;
      })
      .catch(err => {
        document.getElementById('apiResult').textContent =
          'API Response: Error - ' + err.message;
      });
  </script>
</body>
</html>
